[package]
name = "karpal-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Structural catalog generator for the Karpal workspace (Lonis discovery vertical)"

[features]
# `lonis` enables the typed Lonis output layer (Block<KarpalPayload>), the
# `karpal` wire-protocol binary, and SubprocessTool-hosted integration. It is
# a spike: the lonis crates are unpublished (0.0.1), so this feature — and the
# binary — are NOT publishable to crates.io until lonis-schema ships there.
default = []
lonis = ["dep:lonis-schema", "dep:lonis-core"]

[[bin]]
name = "karpal"
path = "src/main.rs"
required-features = ["lonis"]

[dependencies]
syn = { version = "3", features = ["full", "visit", "extra-traits", "parsing"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
# Lonis integration (spike): git deps pinned to Lonis develop HEAD. Cross-repo
# pre-publication deps must be git (not path) — relative path deps break across
# worktree locations and aren't portable. Bump the rev as Lonis progresses; the
# `lonis` feature is unpublishable until lonis-schema reaches crates.io.
lonis-schema = { git = "https://github.com/Industrial-Algebra/Lonis.git", rev = "3f3ffdc07a9d5b135a1922bd8637288249c27542", optional = true }
lonis-core = { git = "https://github.com/Industrial-Algebra/Lonis.git", rev = "3f3ffdc07a9d5b135a1922bd8637288249c27542", optional = true }

[dev-dependencies]
tempfile = "3"
