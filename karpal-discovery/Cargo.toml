[package]
name = "karpal-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Structural catalog generator for the Karpal workspace (Lonis discovery vertical)"

[dependencies]
syn = { version = "3", features = ["full", "visit", "extra-traits", "parsing"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
