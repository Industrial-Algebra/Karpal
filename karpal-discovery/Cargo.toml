[package]
name = "karpal-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Structural catalog generator for the Karpal workspace (Lonis discovery vertical)"

[features]
# `lonis` enables the typed Lonis output layer (Block<KarpalPayload> via
# #[derive(BlockPayload)]), the `karpal` wire-protocol binary, and
# SubprocessTool-hosted integration. The lonis crates are unpublished (0.0.1),
# so this feature — and the binary — are NOT publishable to crates.io until
# lonis-schema ships there.
default = []
lonis = ["dep:lonis-schema", "dep:lonis-core"]

[[bin]]
name = "karpal"
path = "src/main.rs"
required-features = ["lonis"]

[dependencies]
syn = { version = "3", features = ["full", "visit", "extra-traits", "parsing"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
# Lonis integration: git deps pinned to Lonis `develop` HEAD. Cross-repo
# pre-publication deps must be git (not path) — relative path deps break across
# worktree locations and aren't portable. This rev carries #[derive(BlockPayload)]
# + render_fn (ADR-0004, Lonis PR #6) and curated JSON Schema emission
# (ADR-0005, Lonis PR #8). Bump as Lonis `develop` advances; the `lonis` feature
# is unpublishable until lonis-schema reaches crates.io.
lonis-schema = { git = "https://github.com/Industrial-Algebra/Lonis.git", rev = "4aa23a66f784041d9c48d8e46f57c829026984bf", optional = true, features = ["derive"] }
lonis-core = { git = "https://github.com/Industrial-Algebra/Lonis.git", rev = "4aa23a66f784041d9c48d8e46f57c829026984bf", optional = true }

[dev-dependencies]
tempfile = "3"
