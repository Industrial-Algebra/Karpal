name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Publish karpal-core (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-topos (NEW in 0.8.0)
        run: cargo publish -p karpal-topos
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-algebra (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-algebra
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-profunctor (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-profunctor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-arrow (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-arrow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-free (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-free
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-effect (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-effect
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-optics (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-optics
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-recursion (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-recursion
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-proof-derive (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-proof-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-proof (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-proof
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-verify-derive (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-verify-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-verify (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-diagram (already published, skip if exists)
        continue-on-error: true
        run: cargo publish -p karpal-diagram
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-higher
        run: cargo publish -p karpal-higher
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-schubert-types
        run: cargo publish -p karpal-schubert-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-std
        run: cargo publish -p karpal-std
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # NEW in 0.9.0: the discovery vertical. karpal-index rides the same
      # version bump (it stays published for legacy invocations until
      # deprecation); karpal-discovery publishes after all of its workspace
      # dependencies (core, algebra, free, proof, recursion, diagram,
      # schubert-types — all earlier in this order). Its `lonis` feature
      # and the `karpal` bin are optional, so the default-feature publish
      # ships the library only.
      - name: Publish karpal-index
        continue-on-error: true
        run: cargo publish -p karpal-index
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish karpal-discovery
        run: cargo publish -p karpal-discovery
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Anti-masking: continue-on-error steps above make republish idempotent
      # but also swallow genuine failures (a misordered crate failed green in
      # the 0.9.0 run and only a redundant duplicate step saved the release).
      # This step fails the run loudly if any workspace crate is not at the
      # released version on crates.io.
      - name: Verify all crates published at the released version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          CRATES=$(sed -n 's/^members = \[\(.*\)\]/\1/p' Cargo.toml | tr -d '"' | tr ',' ' ')
          echo "Expecting all of: $CRATES at $VERSION"
          for crate in $CRATES; do
            sleep 5
            max=$(curl -sf -H 'User-Agent: karpal-publish-verify (justin@industrialalgebra.com)' \
              "https://crates.io/api/v1/crates/$crate" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])' \
              2>/dev/null || echo ABSENT)
            if [ "$max" != "$VERSION" ]; then
              echo "::error::$crate is at $max on crates.io, expected $VERSION"
              exit 1
            fi
            echo "ok $crate $max"
          done

      - name: Trigger Netlify docs deploy
        run: curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
